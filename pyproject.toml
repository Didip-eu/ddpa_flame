[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flame"
version = "1.3.0.dev0"
description = "FLAME - Formulaic Language Analysis in Medieval Expressions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["networkx", "numpy", "regex", "scikit-learn", "scipy", "tqdm"]

[project.optional-dependencies]
# Native builds of what flame.fuzz and flame.bpe compute in pure Python.
native = ["rapidfuzz", "tokenizers"]
heatmap = ["plotly"]
# flame_ddp.py, the Monasterium NG API client.
ddp = ["httpx"]

[project.scripts]
flame = "flame.analysis:main"

[tool.setuptools]
packages = ["flame"]
